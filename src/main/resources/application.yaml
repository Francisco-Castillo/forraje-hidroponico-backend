spring:
  application:
    name: sensores
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:-5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

sensores:
  mqtt:
    url: tcp://localhost:1883
    username: ${MQTT_USER}
    password: ${MQTT_PASSWORD}
    client-id: sensores-backend
    topic: fvh/+/lecturas
  api:
    max-rango: 7d
    max-page-size: 100
